name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for forbidden files in public/
        run: |
          FORBIDDEN=(
            "public/install.php"
            "public/install_ajax.php"
            "public/install-b.php"
            "public/db_config.json"
            "public/composer.phar"
            "public/phpinfo.php"
            "public/install_error.log"
          )
          for f in "${FORBIDDEN[@]}"; do
            if [ -f "$f" ]; then
              echo "❌ Forbidden file present: $f"
              exit 1
            fi
          done
          echo "✅ No forbidden files in public/"

      - name: Check for unexpected PHP files in public/ (only index.php allowed)
        run: |
          UNEXPECTED=$(find public/ -name '*.php' ! -path 'public/index.php' 2>/dev/null)
          if [ -n "$UNEXPECTED" ]; then
            echo "❌ Unexpected PHP files in public/:"
            echo "$UNEXPECTED"
            exit 1
          fi
          echo "✅ Only public/index.php is present"

      - name: Scan for hardcoded secrets
        run: |
          ERRORS=0
          SECRET_PATTERNS=(
            'KEYGEN_API_TOKEN=[^"'"'"'\s]'
            'admin-[A-Za-z0-9]\{20,\}'
          )
          for pattern in "${SECRET_PATTERNS[@]}"; do
            matches=$(grep -r --include='*.php' --include='*.env' --include='*.json' \
              --exclude-dir=vendor --exclude-dir=node_modules --exclude='*.blade.php' \
              -l "$pattern" 2>/dev/null)
            if [ -n "$matches" ]; then
              echo "⚠ Possible secret match for pattern: $pattern"
              echo "$matches"
              ERRORS=$((ERRORS + 1))
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Secret scanning found potential issues"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

      - name: Check .env.example has no real credentials
        run: |
          ERRORS=0
          grep -q 'APP_KEY=.\{10,\}' .env.example && echo "❌ .env.example has non-empty APP_KEY" && ERRORS=$((ERRORS + 1)) || true
          grep -q 'DB_PASSWORD=.\{2,\}' .env.example && echo "❌ .env.example has non-empty DB_PASSWORD" && ERRORS=$((ERRORS + 1)) || true
          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "✅ .env.example credentials are properly empty"

  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, pdo, pdo_mysql, openssl, tokenizer, curl, gd, zip

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find app/ tests/ config/ database/ routes/ -name '*.php' -exec php -l {} \; > /dev/null

      - name: Run PHPUnit tests
        run: php artisan test --parallel || php artisan test
