name: Build and Push Docker Image

on:
  push:
    branches:
      - Staging

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/tadreeblms:v${{ github.run_number }} \
            -t ${{ secrets.DOCKER_USERNAME }}/tadreeblms:latest \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tadreeblms:v${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/tadreeblms:latest